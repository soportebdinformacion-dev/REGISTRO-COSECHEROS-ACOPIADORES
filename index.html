<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#DA291C">
  <title>REPORTE DE COSECHADORES - Registro para Acopiadores(as)</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Iconos (sprite SVG) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-cal" viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm-2 8h14v10H5V10z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></symbol>
    <symbol id="i-badge" viewBox="0 0 24 24"><path d="M12 2l3 2 3.5-.5L19 7l2.5 2.5L20 13l1 3.5-3.5 1-2 3-3.5-1.5L8.5 20.5l-2-3L3 16.5 4 13 2.5 9.5 5 7l.5-3.5L9 4l3-2z"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9 3L8 8H3v2h4.6l-1 4H2v2h4.1L5 21h2l1.1-5h4L11 21h2l1.1-5H19v-2h-4.6l1-4H21V8h-4.1L18 3h-2l-1.1 5h-4L12 3H9zm.6 7h4l-1 4h-4l1-4z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM15 9H5V5h10v4z"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6a6 6 0 0 1 5.7 7.9l1.5 1.5A8 8 0 0 0 12 4zm0 14a6 6 0 0 1-5.7-7.9L4.8 8.6A8 8 0 0 0 12 20v3l4-4-4-4v3z"/></symbol>
    <symbol id="i-online" viewBox="0 0 24 24"><path d="M1 9l2 2a13 13 0 0 1 18 0l2-2A16 16 0 0 0 1 9zm8 8l3 3 3-3a4 4 0 0 0-6 0zm-4-4l2 2a8 8 0 0 1 10 0l2-2a11 11 0 0 0-14 0z"/></symbol>
    <symbol id="i-offline" viewBox="0 0 24 24"><path d="M2.3 1L1 2.3l4.2 4.2A16 16 0 0 0 1 9l2 2a13 13 0 0 1 3.7-2.6l2.3 2.3A9 9 0 0 0 5 13l2 2a7 7 0 0 1 3-1.8l2.2 2.2A4 4 0 0 0 9 17l3 3 3-3-.3-.3 5.5 5.5 1.3-1.3L2.3 1zM12 4c4 0 7.5 1.5 10.2 4l-2 2a13 13 0 0 0-5-2.8L13.3 5A16 16 0 0 1 23 9l-1.2 1.2A14 14 0 0 0 12 6V4z"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15l-5-5 1.4-1.4L10 14.2l7.6-7.6L19 8l-9 9z"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11h-5V7h2v4h3v2z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M16.2 3.3a2 2 0 0 0-2.8 0L3.3 13.4a2 2 0 0 0 0 2.8l4.5 4.5H21v-2h-7l6.7-6.7a2 2 0 0 0 0-2.8l-4.5-4.5-.3-.3z"/></symbol>
  </svg>

  <header class="top">
    <img id="logo" class="logo" src="LOGO%20HUARMEY.png" alt="Agrícola Huarmey" width="320" height="90">
    <div id="logoFallback" class="logo-fallback" hidden>AGRÍCOLA HUARMEY</div>
    <h1>REPORTE DE COSECHADORES</h1>
    <p class="subtitle">Registro para Acopiadores(as)</p>
  </header>

  <main class="wrap">
    <!-- Estado de conexión y listas -->
    <section class="statusbar" aria-live="polite">
      <div id="connBadge" class="badge badge-off"><svg class="ic"><use href="#i-offline"/></svg><span>Sin conexión</span></div>
      <div id="mastersInfo" class="muted small">Listas: sin descargar</div>
    </section>
    <div id="configWarn" class="alert alert-warn" hidden>
      <svg class="ic"><use href="#i-warn"/></svg>
      <span>Falta configurar la URL de la API en <b>config.js</b>. Podrá registrar, pero no sincronizar.</span>
    </div>

    <!-- Formulario -->
    <form id="form" class="card" novalidate autocomplete="off">
      <div class="field">
        <label for="fecha"><svg class="ic"><use href="#i-cal"/></svg>FECHA REGISTRO</label>
        <input type="date" id="fecha" required>
        <div class="err" id="err-fecha"></div>
      </div>
      <div class="field">
        <label for="modulo"><svg class="ic"><use href="#i-grid"/></svg>MODULO - TURNO</label>
        <select id="modulo" required><option value="">Seleccione…</option></select>
        <div class="err" id="err-modulo"></div>
      </div>
      <div class="field">
        <label for="acopiador"><svg class="ic"><use href="#i-user"/></svg>DATOS ACOPIADOR</label>
        <select id="acopiador" required><option value="">Seleccione…</option></select>
        <div class="err" id="err-acopiador"></div>
      </div>
      <div class="field">
        <label for="caporal"><svg class="ic"><use href="#i-badge"/></svg>DATOS CAPORAL</label>
        <select id="caporal" required><option value="">Seleccione…</option></select>
        <div class="err" id="err-caporal"></div>
      </div>
      <div class="field">
        <label for="total"><svg class="ic"><use href="#i-hash"/></svg>TOTAL</label>
        <input type="text" id="total" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="Número entero" required>
        <div class="err" id="err-total"></div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-green" id="btnSave"><svg class="ic"><use href="#i-save"/></svg>GUARDAR REGISTRO</button>
        <button type="button" class="btn btn-gray" id="btnClear"><svg class="ic"><use href="#i-eraser"/></svg>LIMPIAR FORMULARIO</button>
      </div>
    </form>

    <!-- Sincronización -->
    <section class="card">
      <h2><svg class="ic"><use href="#i-sync"/></svg>Sincronización</h2>
      <div class="counters">
        <div class="counter c-pend"><svg class="ic"><use href="#i-clock"/></svg><b id="cPend">0</b><span>PENDIENTE</span></div>
        <div class="counter c-sync"><svg class="ic"><use href="#i-ok"/></svg><b id="cSync">0</b><span>SINCRONIZADO</span></div>
        <div class="counter c-err"><svg class="ic"><use href="#i-warn"/></svg><b id="cErr">0</b><span>ERROR</span></div>
      </div>
      <div class="actions">
        <button class="btn btn-red" id="btnSync" type="button"><svg class="ic"><use href="#i-sync"/></svg>SINCRONIZAR AHORA</button>
        <button class="btn btn-gray" id="btnMasters" type="button"><svg class="ic"><use href="#i-sync"/></svg>ACTUALIZAR LISTAS</button>
      </div>
      <div id="syncMsg" class="muted small" role="status"></div>
    </section>

    <!-- Registros locales -->
    <section class="card">
      <h2>Registros en este dispositivo</h2>
      <div class="tabs" role="tablist">
        <button class="tab on" data-f="ALL" type="button">Todos</button>
        <button class="tab" data-f="PENDIENTE" type="button">Pendientes</button>
        <button class="tab" data-f="ERROR" type="button">Errores</button>
        <button class="tab" data-f="SINCRONIZADO" type="button">Sincronizados</button>
      </div>
      <ul id="list" class="list"></ul>
      <button class="btn btn-gray btn-small" id="btnPurge" type="button"><svg class="ic"><use href="#i-trash"/></svg>Quitar sincronizados de este equipo</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
